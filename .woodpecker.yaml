# Global conditions: Runs whenever a push occurs on either target branch
when:
  - branch: codeberg-staging
    event: push
  - branch: main
    event: push

steps:
  # Step 1: Pre-validation sequence for development staging checks
  validate-pretext:
    image: straightwood/texlive-python:latest
    commands:
      - pip install pretext[all]
      - pretext build html
    when:
      branch: codeberg-staging

  # Step 2: Main compilation sequence for production distribution
  build:
    image: python:3.12
    commands:
      - pip install pretext
      - pretext build course
    when:
      branch: main

  # Step 3: Distribution handler to inject files into the pages branch
  deploy:
    image: woodpeckerci/plugin-deploy:latest
    settings:
      target: pages
      folder: output/course
    when:
      branch: main
