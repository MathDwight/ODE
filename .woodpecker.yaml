# Global conditions: Runs whenever a push occurs on either target branch
when:
  - branch: codeberg-staging
    event: push
  - branch: main
    event: push

steps:
  # Validate that the PreTeXt source files compile cleanly on Codeberg CI
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  # Main compilation sequence for production distribution
  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  # Native distribution pipeline to update the hosting pages branch via token
  deploy:
    image: alpine:latest
    commands:
      - apk add --no-cache git
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      # Clone the independent target pages branch over HTTPS using the internal token
      - git clone -b pages https://$CI_REPO_TOKEN@codeberg.org/$CI_REPO.git target_pages_dir || git init target_pages_dir && cd target_pages_dir && git checkout -b pages
      # Copy compiled html assets into the tracking target directory
      - cp -ar output/course/. target_pages_dir/
      - cd target_pages_dir
      - git add .
      # Only commit and push if new file changes actually exist
      - git diff-index --quiet HEAD || git commit -m "Deploy textbook update - Build #${CI_PIPELINE_NUMBER}"
      - git push https://$CI_REPO_TOKEN@codeberg.org/$CI_REPO.git pages
    when:
      branch: main
