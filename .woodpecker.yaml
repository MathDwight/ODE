# Global conditions: Runs whenever a push occurs on either target branch
when:
  - branch: codeberg-staging
    event: push
  - branch: main
    event: push

steps:
  # Validate that the PreTeXt source files compile cleanly on Codeberg CI
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  # Main compilation sequence for production distribution
  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  # Native distribution pipeline using internal token over HTTPS
  deploy:
    image: pretextbook/pretext:latest
    commands:
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      # Securely map the repository authorization token into the internal machine netrc config file
      - echo "machine codeberg.org login token password ${CI_REPO_TOKEN}" > ~/.netrc
      - chmod 600 ~/.netrc
      # Clone just the single pages branch history directly from Codeberg into a deployment space
      - git clone --single-branch --branch pages https://codeberg.org{CI_REPO}.git deploy_dir || (mkdir deploy_dir && cd deploy_dir && git init && git checkout -b pages && cd ..)
      # Copy over the generated course files from your target output folder
      - cp -ar output/course/. deploy_dir/
      - cd deploy_dir
      - git add .
      # Only commit and push if new textbook changes actually exist to prevent building loops
      - git diff-index --quiet HEAD || git commit -m "Deploy textbook update - Build #${CI_PIPELINE_NUMBER} [SKIP CI]"
      - git push https://codeberg.org{CI_REPO}.git pages
    when:
      branch: main
