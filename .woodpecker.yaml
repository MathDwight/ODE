when:
  - branch: codeberg-staging
    event: push
  - branch: main
    event: push

steps:
  # Validate that the PreTeXt source files compile cleanly on Codeberg CI
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  # Main compilation sequence for production distribution
  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  # Native distribution pipeline to update the hosting pages branch via token
  deploy:
    image: pretextbook/pretext:latest
    commands:
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      # Initialize an isolated deployment folder
      - mkdir deploy_dir
      - cd deploy_dir
      - git init
      - git checkout -b pages
      # Pull the contents from your generated web build folder into this space
      - cp -ar ../output/html/. ./
      - git add .
      # Only commit if new file changes exist to prevent infinite loops
      - git diff-index --quiet HEAD || git commit -m "Deploy textbook update - Build #${CI_PIPELINE_NUMBER}"
      # Authenticate securely using the runner token variable mapped inside the standard HTTPS URL
      - git push --force https://token:${CI_REPO_TOKEN}@codeberg.org/${CI_REPO}.git pages
    when:
      branch: main
