# Global conditions: Runs whenever a push occurs on either target branch
when:
  - branch: codeberg-staging
    event: push
  - branch: main
    event: push

steps:
  # Validate that the PreTeXt source files compile cleanly on Codeberg CI
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  # Main compilation sequence for production distribution
  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  # Distribution handler to inject files into the pages branch
  deploy:
    image: codeberg.org/sugar700/plugin-codeberg-pages-deploy:1
    settings:
      folder: output/course
    when:
      branch: main
