# Woodpecker 3.x Schema Verified Configuration Matrix
steps:
  # Validate that the PreTeXt source files compile cleanly on Codeberg CI
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      event: push
      branch: codeberg-staging

  # Main compilation sequence for production distribution
  build:
    image: pretextbook/pretext:latest
    commands:
      # Logs structural document warnings natively to the pipeline output window
      - pretext validate || true
      - pretext build course
    when:
      event: push
      branch: main

  # Native distribution pipeline using isolated SSH Deploy Keys with force override
  deploy:
    image: pretextbook/pretext:latest
    # Safely inject secrets into the shell environment to protect newline formatting
    environment:
      MY_DEPLOY_KEY:
        from_secret: SSH_PRIVATE_KEY
    commands:
      # Bypass Git ownership security limits inside Docker container workspaces
      - git config --global --add safe.directory /woodpecker/src || true
      - git config --global --add safe.directory "$(pwd)" || true

      # Configure Git author identity
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"

      # Install missing SSH packages on the fly depending on underlying container platform type
      - |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache openssh-client
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y openssh-client
        fi

      # Securely set up the local SSH workspace environment using the mapped environment variable
      - mkdir -p ~/.ssh
      # Using printf protects physical newline structures from collapsing inside the shell layer
      - printf "%s\n" "$MY_DEPLOY_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan codeberg.org >> ~/.ssh/known_hosts
      
      # Reset the workspace deployment directory
      - rm -rf deploy_dir

      # Clone pages branch via SSH; if it doesn't exist yet, initialize a clean local context
      - |
        TARGET_URL="git@codeberg.org:MathDwight/ODE.git"
        if git clone --single-branch --branch pages "$TARGET_URL" deploy_dir; then
          cd deploy_dir
          # Safely clear old website tracking assets without breaking the hidden .git directory
          find . -maxdepth 1 -mindepth 1 ! -name ".git" -exec rm -rf {} +
          cd ..
        else
          mkdir -p deploy_dir
          cd deploy_dir
          git init
          git checkout -b pages
          cd ..
        fi

      # Sync and overwrite compiled assets into target deployment folder
      - mkdir -p deploy_dir
      - cp -ar output/course/. deploy_dir/

      # Enter deployment directory and apply safe flags locally to subfolders
      - cd deploy_dir
      - git config --global --add safe.directory "$(pwd)" || true
      - git add -A

      # Commit and push changes safely using the isolated SSH deployment key route
      - |
        TARGET_URL="git@codeberg.org:MathDwight/ODE.git"
        BUILD_NUM="$${CI_PIPELINE_NUMBER}"
        if git diff --cached --quiet; then
          echo "No changes to deploy. Skipping push."
        else
          git commit -m "Deploy textbook update - Build $${BUILD_NUM} [SKIP CI]"
          git push --force "$TARGET_URL" pages:pages
        fi
    when:
      event: push
      branch: main
