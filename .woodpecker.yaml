when:
  - event: push
    branch:
      - codeberg-staging
      - main

steps:
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  deploy:
    image: pretextbook/pretext:latest
    commands:
      # Fix Git ownership security limits inside Docker container workspaces
      - git config --global --add safe.directory /woodpecker/src || true
      - git config --global --add safe.directory $${PWD} || true

      # Configure Git deployment author identity
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"

      # Reset the workspace deployment directory
      - rm -rf deploy_dir

      # Authenticate directly inside the Git URL using the escaped environment token
      - |
        if git clone --single-branch --branch pages "https://token:$${CI_REPO_TOKEN}@codeberg.org/$${CI_REPO}.git" deploy_dir; then
          cd deploy_dir
          # Safely wipe old website tracking assets without breaking the hidden .git directory
          find . -maxdepth 1 -mindepth 1 ! -name ".git" -exec rm -rf {} +
          cd ..
        else
          mkdir -p deploy_dir
          cd deploy_dir
          git init
          git checkout -b pages
          cd ..
        fi

      # Sync and overwrite files into target deployment folder
      - mkdir -p deploy_dir
      - cp -ar output/course/. deploy_dir/

      # Enter directory and apply safe flags locally to subfolders
      - cd deploy_dir
      - git config --global --add safe.directory $${PWD} || true
      - git add -A

      # Commit and push changes safely using inline bash evaluation checks
      - |
        if git diff --cached --quiet; then
          echo "No changes to deploy. Skipping push."
        else
          git commit -m "Deploy textbook update - Build #$${CI_PIPELINE_NUMBER} [SKIP CI]"
          git push "https://token:$${CI_REPO_TOKEN}@codeberg.org/$${CI_REPO}.git" pages:pages || git push --force-with-lease "https://token:$${CI_REPO_TOKEN}@codeberg.org/$${CI_REPO}.git" pages:pages
        fi
    when:
      branch: main
