steps:
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      event: push
      branch: codeberg-staging

  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext validate || true
      - pretext build course
    when:
      event: push
      branch: main

  deploy:
    image: pretextbook/pretext:latest
    commands:
      - git config --global --add safe.directory /woodpecker/src || true
      - git config --global --add safe.directory "$(pwd)" || true

      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"

      - rm -rf deploy_dir

      - |
        TARGET_URL="https://codeberg.org/${CI_REPO}.git"
        if git clone --single-branch --branch pages "$TARGET_URL" deploy_dir; then
          cd deploy_dir
          find . -maxdepth 1 -mindepth 1 ! -name ".git" -exec rm -rf {} +
          cd ..
        else
          mkdir -p deploy_dir
          cd deploy_dir
          git init
          git checkout -b pages
          cd ..
        fi

      - cp -ar output/course/. deploy_dir/

      - |
        cd deploy_dir
        git config --global --add safe.directory "$(pwd)" || true
        git add -A

        if git diff --cached --quiet; then
          echo "No changes to deploy. Skipping push."
          exit 0
        fi

        BUILD_NUM="$${CI_PIPELINE_NUMBER}"
        git commit -m "Deploy textbook update - Build ${BUILD_NUM} [SKIP CI]"

        # ---- Auth diagnostics: check read access first (ls-remote) ----
        PUSH_URL_1="https://${CI_REPO_TOKEN}:x-oauth-basic@codeberg.org/${CI_REPO}.git"
        PUSH_URL_2="https://git:${CI_REPO_TOKEN}@codeberg.org/${CI_REPO}.git"

        echo "Testing read access (ls-remote) with PUSH_URL_1..."
        if git ls-remote "$PUSH_URL_1" > /dev/null 2>&1; then
          echo "PUSH_URL_1 read OK"
        else
          echo "PUSH_URL_1 read FAIL"
        fi

        echo "Testing read access (ls-remote) with PUSH_URL_2..."
        if git ls-remote "$PUSH_URL_2" > /dev/null 2>&1; then
          echo "PUSH_URL_2 read OK"
        else
          echo "PUSH_URL_2 read FAIL"
        fi

        # ---- Push attempt (still required) ----
        echo "Attempting push (PUSH_URL_1)..."
        if git push --force "$PUSH_URL_1" pages:pages; then
          exit 0
        fi

        echo "PUSH_URL_1 push failed; attempting push (PUSH_URL_2)..."
        git push --force "$PUSH_URL_2" pages:pages
    when:
      event: push
      branch: main
