when:
  - event: push
    branch: 
      - codeberg-staging
      - main

steps:
  validate-pretext:
    image: pretextbook/pretext:latest
    commands:
      - pretext build html
    when:
      branch: codeberg-staging

  build:
    image: pretextbook/pretext:latest
    commands:
      - pretext build course
    when:
      branch: main

  deploy:
    image: pretextbook/pretext:latest
    secrets: [ repo_token ]
    commands:
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      
      # Clear and prepare deployment workspace
      - rm -rf deploy_dir
      
      # Clone pages branch or initialize it fresh if it doesn't exist
      - |
        if git clone --single-branch --branch pages "https://token:${REPO_TOKEN}@codeberg.org/${CI_REPO}.git" deploy_dir; then
          cd deploy_dir
          # Clean old files to prevent orphaned assets, keeping git history
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cd ..
        else
          mkdir -p deploy_dir
          cd deploy_dir
          git init
          git checkout -b pages
          cd ..
        fi

      # Sync build artifacts and push
      - cp -ar output/course/. deploy_dir/
      - cd deploy_dir
      - git add -A
      - |
        if ! git diff-index --quiet HEAD; then
          git commit -m "Deploy textbook update - Build #${CI_PIPELINE_NUMBER} [skip ci]"
          git push "https://token:${REPO_TOKEN}@codeberg.org/${CI_REPO}.git" pages
        fi
    when:
      branch: main
